[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom"
version = "0.1.0"
description = "Example library"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Dennis" }
]

[project.urls]
Homepage = "https://example.com"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
